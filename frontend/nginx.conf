# Serves the SPA and proxies /api to FastAPI. TLS is terminated here (or at ADA ingress) in UAT/PROD.
server {
  listen 80;
  server_name _;
  client_max_body_size 250m;
  root /usr/share/nginx/html;

  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  # OnlyOffice api.js and frames come from the intranet Document Server; adjust ONLYOFFICE host below.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${ONLYOFFICE_ORIGIN}; frame-src 'self' ${ONLYOFFICE_ORIGIN}; connect-src 'self' ${ONLYOFFICE_ORIGIN}; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
