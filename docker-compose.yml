# ADA-ELM — Docker Compose (intranet / air-gapped). All images pinned; no runtime internet access required.
# Usage:  cp .env.example .env  &&  docker compose up -d --build
name: ada-elm

services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: elm
      POSTGRES_USER: elm
      POSTGRES_PASSWORD: ${ELM_DB_PASSWORD:?set ELM_DB_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U elm -d elm"], interval: 10s, timeout: 5s, retries: 10 }
    networks: [data]

  backend:
    build: ./backend
    image: ada-elm/backend:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      ELM_DATABASE_URL: postgresql+psycopg://elm:${ELM_DB_PASSWORD}@db:5432/elm
    volumes: [elm-files:/data]
    depends_on: { db: { condition: service_healthy } }
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [app, data]

  worker:
    image: ada-elm/backend:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      ELM_DATABASE_URL: postgresql+psycopg://elm:${ELM_DB_PASSWORD}@db:5432/elm
    command: ["python", "-m", "app.worker"]
    volumes: [elm-files:/data]
    depends_on: [backend]
    networks: [data]

  web:
    build: { context: ./frontend, args: { VITE_DEMO_HINT: "${ELM_DEMO_HINT:-0}" } }
    image: ada-elm/web:0.1.0
    restart: unless-stopped
    environment:
      ONLYOFFICE_ORIGIN: ${ELM_ONLYOFFICE_PUBLIC_URL:-http://localhost:8080}
    ports: ["${ELM_HTTP_PORT:-8088}:80"]
    depends_on: [backend]
    networks: [app]

  # Optional: only if you do NOT already run OnlyOffice. Start with: docker compose --profile onlyoffice up -d
  onlyoffice:
    profiles: [onlyoffice]
    image: onlyoffice/documentserver:8.2.2
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ELM_ONLYOFFICE_JWT_SECRET}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports: ["8080:80"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [app]

volumes:
  db-data:
  elm-files:

networks:
  app:
  data:
    internal: true
